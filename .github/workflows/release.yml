name: Release

# Builds the `cairn` binary for each platform when a version tag is pushed and attaches the
# archives, with SHA-256 checksums, to the GitHub release for that tag.
on:
  push:
    tags: ["v*"]
  # Rebuild the archives for an existing tag, for example after a runner image is retired.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  # For the signed statement of where each archive was built (docs/RELEASING.md).
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The same script a checker runs: docs/RELEASING.md.
      - run: scripts/release-build.sh --target ${{ matrix.target }}
      - name: Package
        run: |
          name="cairn-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/cairn" README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      # A statement signed by GitHub's identity for this workflow run, not by a key anyone
      # holds: this archive was built by this workflow from this commit.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "cairn-*.tar.gz"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" cairn-*.tar.gz cairn-*.tar.gz.sha256 --clobber
