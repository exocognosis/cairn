[workspace]
resolver = "2"
members = ["crates/threshold-mldsa", "crates/cascade-tower", "crates/mpc-bridge", "crates/cairn-net", "crates/cairn-sidecar"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
publish = false
repository = "https://github.com/exocognosis/cairn"
homepage = "https://github.com/exocognosis/cairn"
authors = ["Rick Glenn"]
license = "MIT"
keywords = ["post-quantum", "ml-dsa", "threshold", "mpc", "fips204"]
categories = ["cryptography"]
readme = "README.md"

[workspace.dependencies]
base64 = "0.22"
bincode = "1.3"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
rand = "0.8"
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
thiserror = "1"
tiny_http = "0.12"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
